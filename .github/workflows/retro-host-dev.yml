name: Retro host client (temporary)

on:
  push:
    branches: [feat/parity-retro-host-client]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/macos/launcher
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - uses: actions/cache/restore@v6
        with:
          path: tools/macos/launcher/.build
          key: launcher-spm-${{ runner.os }}-${{ hashFiles('tools/macos/launcher/Package.resolved') }}-none
          restore-keys: launcher-spm-${{ runner.os }}-${{ hashFiles('tools/macos/launcher/Package.resolved') }}-
      - name: Fetch the emulator host's fixtures and fake host
        run: |
          git init -q "$RUNNER_TEMP/retro-host"
          git -C "$RUNNER_TEMP/retro-host" fetch -q --depth 1 https://github.com/AnyTogether/anyps5-retro-host.git 9caabf4ccd33bdd499130b0e03d49de168933d6f
          git -C "$RUNNER_TEMP/retro-host" checkout -q FETCH_HEAD
          echo "ANYPS5_RETRO_HOST_CHECKOUT=$RUNNER_TEMP/retro-host" >> "$GITHUB_ENV"
      - name: swift test (the emulator host client)
        run: |
          which -a python3
          swift test --filter 'RetroJSONTests|RetroStatusTests|RetroFrameRingTests|RetroHost'
