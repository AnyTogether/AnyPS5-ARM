# The Windows and Linux engine archives AnyPS5 Desktop downloads from AnyPS5-ARM's releases
# (AnyPS5-toolkit-windows-<commit>.zip, AnyPS5-toolkit-linux-<commit>.tar.gz / .zip), built from a
# release tag the way docs/dev/WINDOWS_LINUX_ENGINE.md builds them by hand: WinLibs GCC 15.2 on
# Windows, GCC 12 on Ubuntu 22.04 for Linux (glibc 2.35 at most). The online, remote pad,
# AppContent, UserService and power control tests run on both before packaging. The archives are
# artifacts only; they are signed with the rest of the release on the release Mac
# (docs/dev/SIGNED_UPDATES.md), since the key never leaves it.
name: Engine toolkits

on:
  push:
    tags: ['v*-arm']
  workflow_dispatch:
  # Only when this workflow or the packaging changes, to check that it still builds.
  pull_request:
    paths:
      - .github/workflows/engine-toolkits.yml
      - tools/package_arm_toolkit.py
      - tools/package_release.py

permissions:
  contents: read

concurrency:
  group: engine-toolkits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
  SMOKE_TARGETS: >-
    online_bridge_tests online_np_manager_tests online_web_api2_tests online_net_p2p_tests
    online_probe online_observation_tests remote_pad_tests guest_appcontent_tests
    guest_appcontent_addons_tests guest_user_service_tests guest_user_service_user_name_tests
    guest_user_service_lifecycle_tests guest_user_service_presets_tests power_control_tests
  SMOKE_TESTS: online|remote_pad|appcontent|user_service|power_control

jobs:
  linux:
    name: Linux engine (Ubuntu 22.04, GCC 12)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install GCC 12, Ninja and the audio/display development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config \
            libpipewire-0.3-dev libdecor-0-dev libvulkan-dev libx11-dev libxext-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libpulse-dev libasound2-dev
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: engine-toolkit-linux
          max-size: 2G
          evict-old-files: job
      - id: ffmpeg
        run: echo "commit=$(git rev-parse HEAD:3rdparty/ffmpeg-core)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/externals
          key: ffmpeg-linux-${{ steps.ffmpeg.outputs.commit }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build the relinker, the patched libraries and the smoke tests
        run: cmake --build build --target relinker libs $SMOKE_TARGETS
      - name: Check the glibc and libstdc++ floor (2.35, GCC 12)
        run: |
          glibc=$(objdump -T build/core/libs/libs/*.prx build/core/relinker/relinker | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          glibcxx=$(objdump -T build/core/libs/libs/*.prx build/core/relinker/relinker | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          echo "highest symbol versions: $glibc $glibcxx"
          printf '%s\n' "$glibc" GLIBC_2.35 | sort -CV || { echo "::error::The engine needs $glibc, newer than Ubuntu 22.04's glibc 2.35"; exit 1; }
          printf '%s\n' "$glibcxx" GLIBCXX_3.4.30 | sort -CV || { echo "::error::The engine needs $glibcxx, newer than GCC 12's libstdc++"; exit 1; }
      - name: Allow userfaultfd for the guest write watch
        run: sudo sysctl -w vm.unprivileged_userfaultfd=1
      - name: Run the smoke tests
        run: ctest --test-dir build -R "$SMOKE_TESTS" --output-on-failure --timeout 120 --no-tests=error --repeat until-pass:3
      - name: Pack the toolkit
        run: python3 tools/package_arm_toolkit.py --platform linux --build build --output dist --commit "$(git rev-parse --short=9 HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-toolkit-linux
          path: dist/AnyPS5-toolkit-linux-*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows engine (WinLibs GCC 15.2)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Point the WinLibs CMake at the CA bundle of Git for Windows
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "::error::No CA bundle found in Git for Windows"; exit 1
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: engine-toolkit-windows
          max-size: 3G
          evict-old-files: job
      - id: ffmpeg
        run: echo "commit=$(git rev-parse HEAD:3rdparty/ffmpeg-core)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/externals
          key: ffmpeg-windows-${{ steps.ffmpeg.outputs.commit }}
      - name: Configure
        shell: cmd
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build the relinker, the patched libraries and the smoke tests
        shell: cmd
        run: cmake --build build --target relinker libs %SMOKE_TARGETS%
      # From cmd, as in AnyTogether CI: Git Bash puts its own mingw64/bin (another libstdc++-6.dll)
      # ahead of WinLibs on PATH, and the patched libraries then fail to load.
      - name: Run the smoke tests
        shell: cmd
        run: ctest --test-dir build -R "%SMOKE_TESTS%" --output-on-failure --timeout 120 --no-tests=error --repeat until-pass:3
      - id: commit
        run: echo "short=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      # From cmd too, so that the packaging finds WinLibs' g++ and its runtime DLLs first.
      - name: Pack the toolkit
        shell: cmd
        run: python tools\package_arm_toolkit.py --platform windows --build build --output dist --commit ${{ steps.commit.outputs.short }}
      - uses: actions/upload-artifact@v7
        with:
          name: engine-toolkit-windows
          path: dist/AnyPS5-toolkit-windows-*
          if-no-files-found: error
          retention-days: 14
