# A nightly Windows and Linux engine for AnyPS5 Desktop, built from main once a day when core/,
# tools/macos/ or mobile/ changed, and published as a GitHub pre-release for the launchers' Nightly
# update channel. The release Mac adds the macOS app and engine to it later
# (tools/release/nightly_mac.sh), so a change to the Mac launcher or the phone app alone gets a
# nightly too.
#
# The tag is named as tools/macos/publish_nightly.sh names the Mac's nightlies:
# v<next>-arm-nightly.<YYYYMMDD>.<n>, <next> being the last release with its last number raised
# and <n> counting that day's nightlies from 1 (UTC), Mac and CI alike. The launchers sort these
# after the release before them and before the release they lead to.
#
# The build is engine-toolkits.yml's, called with the commit and the tag. The pre-release carries
# AnyPS5-toolkit-windows-<commit>.zip, AnyPS5-toolkit-linux-<commit>.zip and .tar.gz.
#
# CI has no signing key (docs/dev/SIGNED_UPDATES.md), so the pre-release comes out unsigned, and
# the launchers refuse it until tools/release/sign_nightly.sh <tag> has added SHA256SUMS and
# SHA256SUMS.sig on the release Mac.
#
# The tag and the release are made with GITHUB_TOKEN. Events made with GITHUB_TOKEN start no other
# workflow, so this tag does not start release.yml (`v*`, disabled in this repository anyway) or
# anything else. engine-toolkits.yml's own tag trigger (`v*-arm`) does not match a nightly tag.
#
# Upstream nightly: on its own schedule (or by hand with `upstream`), upstream AnyPS5's main
# (boykopovar/AnyPS5) is built as it is, for AnyPS5 Desktop users who want upstream's newest engine
# rather than AnyPS5-ARM's. It is skipped when upstream's main has not moved since the last
# upstream nightly. engine-toolkits.yml builds it with `repository`: the same toolchains, the smoke
# tests upstream has of AnyPS5-ARM's set, and upstream's own release packaging, named after
# upstream's git describe; the pre-release carries what AnyPS5 Desktop downloads of it:
# relinker-<describe>.exe and prx-windows-<describe>.zip, relinker-<describe> and
# prx-linux-<describe>.tar.gz (the unpatched libraries and the other archive format would only
# make the nightly four times as large). It is published as a pre-release tagged upstream-nightly.<YYYYMMDD>.<9-digit
# upstream commit>: no version the launchers read (they leave it out of updates, and the Mac's
# engine picker looks only for AnyPS5-toolkit-macos-*), and its tag names a commit of its own with
# no parents, so that git describe on main (the relinker's version, the launchers') never finds it.
# It is unsigned too until tools/release/sign_nightly.sh <tag> signs it (nightly_mac.sh does it
# daily); AnyPS5 Desktop offers it on its Nightly channel once it is.
name: Engine nightly

on:
  schedule:
    - cron: '23 2 * * *'
    # The upstream nightly (the upstream-* jobs below).
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even without core/, tools/macos/ or mobile/ changes, or when today already has a CI nightly (with upstream, even when upstream's main has not moved).
        type: boolean
        default: false
      dry_run:
        description: Plan and build, but make no tag and no release.
        type: boolean
        default: false
      upstream:
        description: Build upstream's main (boykopovar/AnyPS5, unmodified) instead of AnyPS5-ARM's.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: engine-nightly${{ (github.event.schedule == '47 0 * * *' || inputs.upstream) && '-upstream' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    if: github.event.schedule != '47 0 * * *' && !inputs.upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          sha="$(git rev-parse HEAD)"
          skip() { echo "::notice::No nightly: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The last release: the highest vX.Y.Z-arm tag (nightly tags have more after -arm).
          last="$(git tag -l 'v*-arm' | grep -E '^v[0-9]+(\.[0-9]+)*-arm$' | sed 's/^v//; s/-arm$//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          [ -n "$last" ] || { echo "::error::No release tag found"; exit 1; }
          next="$(echo "$last" | awk -F. '{ $NF = $NF + 1; print }' OFS=.)"
          day="$(date -u +%Y%m%d)"
          count=1
          for candidate in $(git tag -l "v$next-arm-nightly.$day.*"); do
            n="${candidate##*.}"
            case "$n" in *[!0-9]*|'') continue ;; esac
            [ "$n" -ge "$count" ] && count=$((n + 1))
          done
          tag="v$next-arm-nightly.$day.$count"

          # The newest nightly that carries the Windows and Linux engine (Mac nightlies may not).
          toolkit_nightly="$(gh api "repos/$REPO/releases?per_page=50" --jq '
            [.[] | select(.draft | not) | select(.prerelease) | select(.tag_name | test("-arm-nightly\\."))
                 | select([.assets[].name | test("^AnyPS5-toolkit-windows-.*\\.zip$")] | any)
                 | select([.assets[].name | test("^AnyPS5-toolkit-linux-.*\\.(zip|tar\\.gz)$")] | any)]
            | sort_by(.created_at) | last | .tag_name // empty')"
          echo "last release v$last-arm, last nightly with toolkits: ${toolkit_nightly:-none}, next tag $tag"

          if [ -n "$toolkit_nightly" ] && [ "$(git rev-list -n 1 "$toolkit_nightly")" = "$sha" ]; then
            skip "$toolkit_nightly already is main's nightly"
          fi
          # Changes are counted from that nightly when it is past the last release, else from the release.
          base="v$last-arm"
          if [ -n "$toolkit_nightly" ] && git merge-base --is-ancestor "$base" "$toolkit_nightly" &&
            git merge-base --is-ancestor "$toolkit_nightly" HEAD; then
            base="$toolkit_nightly"
          fi
          if [ "$FORCE" != true ]; then
            case "$toolkit_nightly" in
              *-arm-nightly."$day".*) skip "today already has $toolkit_nightly" ;;
            esac
            if git diff --quiet "$base" HEAD -- core/ tools/macos/ mobile/; then
              skip "core/, tools/macos/ and mobile/ have not changed since $base"
            fi
          fi
          {
            echo "build=true"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/engine-toolkits.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      tag: ${{ needs.plan.outputs.tag }}

  publish:
    name: Publish the pre-release
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-toolkit-*
          path: dist
          merge-multiple: true
      - name: Write the notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          previous="$(git tag -l 'v*-arm' 'v*-arm-nightly.*' --sort=-creatordate --merged HEAD | sed -n 1p)"
          {
            echo "Nightly build of main, $(date -u +%Y-%m-%d), $(git rev-parse --short=12 HEAD). It may have new bugs: the launchers offer it only on their Nightly update channel."
            echo
            echo "Windows and Linux: the engine for AnyPS5 Desktop. macOS: AnyPS5-macOS.zip and the Mac engine are added by the release Mac (tools/release/nightly_mac.sh), usually within a day; the Mac launcher offers this nightly once they are here."
            echo
            echo "It is unsigned until it is signed on the release Mac (tools/release/sign_nightly.sh). The launchers refuse it until then."
            echo
            echo "Since ${previous:-the start}:"
            echo
            # git stops at 40 itself: head would close the pipe early and pipefail would fail the job (141).
            git log --no-merges --max-count=40 --format='- %s' ${previous:+"$previous..HEAD"}
            total="$(git rev-list --no-merges --count ${previous:+"$previous..HEAD"})"
            [ "$total" -le 40 ] || echo "- … and $((total - 40)) more"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          ls -l dist
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A Mac nightly may have taken the name meanwhile: then nothing is published.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists already"; exit 1
          fi
          # The tag is made on GitHub at the built commit.
          gh release create "$TAG" dist/AnyPS5-toolkit-* --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "AnyPS5-ARM $version (nightly)" --notes-file "$RUNNER_TEMP/notes.md"
          echo "published https://github.com/$REPO/releases/tag/$TAG"

  # ------------------------------------------------------------------ upstream nightly

  upstream-plan:
    name: Decide whether to build upstream main
    if: github.event.schedule == '47 0 * * *' || inputs.upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM: boykopovar/AnyPS5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::No upstream nightly: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          sha="$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No commit for $UPSTREAM main: $sha"; exit 1; }
          short="${sha:0:9}"
          tag="upstream-nightly.$(date -u +%Y%m%d).$short"
          last="$(gh api "repos/$REPO/releases?per_page=100" --jq '
            [.[] | select(.draft | not) | select(.tag_name | test("^upstream-nightly\\.[0-9]{8}\\.[0-9a-f]{9}$"))]
            | sort_by(.created_at) | last | .tag_name // empty')"
          echo "$UPSTREAM main is $sha; last upstream nightly: ${last:-none}; next tag $tag"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            skip "$tag exists already"
          fi
          if [ "$FORCE" != true ] && [ -n "$last" ] && [ "${last##*.}" = "$short" ]; then
            skip "$UPSTREAM main has not moved since $last"
          fi
          {
            echo "build=true"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  upstream-build:
    name: Build upstream main
    needs: upstream-plan
    if: needs.upstream-plan.outputs.build == 'true'
    uses: ./.github/workflows/engine-toolkits.yml
    with:
      repository: boykopovar/AnyPS5
      ref: ${{ needs.upstream-plan.outputs.sha }}
      tag: ${{ needs.upstream-plan.outputs.tag }}

  upstream-publish:
    name: Publish the upstream pre-release
    needs: [upstream-plan, upstream-build]
    if: needs.upstream-plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UPSTREAM: boykopovar/AnyPS5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-upstream-*
          path: dist
          merge-multiple: true
      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.upstream-plan.outputs.sha }}
        run: |
          set -euo pipefail
          ls -l dist
          relinker="$(cd dist && ls relinker-v*.exe)"
          describe="${relinker#relinker-}"; describe="${describe%.exe}"
          date="$(gh api "repos/$UPSTREAM/commits/$SHA" --jq .commit.committer.date)"
          subject="$(gh api "repos/$UPSTREAM/commits/$SHA" --jq '.commit.message | split("\n") | first')"
          {
            echo "**Unmodified upstream main, untested.**"
            echo
            echo "Upstream commit: [\`$SHA\`](https://github.com/$UPSTREAM/commit/$SHA) ($date, git describe \`$describe\`): $subject"
            echo
            echo "Built by AnyPS5-ARM's CI from $UPSTREAM main as it is, with nothing of AnyPS5-ARM's in it (so no phone controller and no full screen or window size settings): the relinker and the libraries upstream's own release packaging makes, for Windows (WinLibs GCC 15.2, the libraries as .zip) and Linux (Ubuntu 22.04, GCC 12: glibc 2.35 or newer; the libraries as .tar.gz). The unpatched libraries are left out. Only the build and the smoke tests upstream has of AnyPS5-ARM's set ran; no game was tried."
            echo
            echo "It is neither an upstream release nor an AnyPS5-ARM one. AnyPS5 Desktop offers it only on its Nightly update channel, and only once it is signed on the release Mac (tools/release/sign_nightly.sh): until then the launchers refuse it. The Mac launcher does not offer it."
            echo
            echo "<!-- upstream-commit: $SHA -->"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          echo "DESCRIBE=$describe" >> "$GITHUB_ENV"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.upstream-plan.outputs.tag }}
          SHA: ${{ needs.upstream-plan.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag names a commit of its own, with no parents: it is in none of main's history, so
          # git describe on main never takes it for the version.
          readme="$(printf '%s\n\n%s\n' "# $TAG" "Upstream AnyPS5's main at https://github.com/$UPSTREAM/commit/$SHA ($DESCRIBE), built unmodified by AnyPS5-ARM's CI. The files are on the release: https://github.com/$REPO/releases/tag/$TAG")"
          tree="$(jq -n --arg text "$readme" '{tree: [{path: "UPSTREAM.md", mode: "100644", type: "blob", content: $text}]}' |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "Upstream nightly: $UPSTREAM $SHA" --arg tree "$tree" '{message: $message, tree: $tree, parents: []}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)"
          gh release create "$TAG" dist/* --repo "$REPO" --target "$commit" --prerelease --latest=false \
            --title "Upstream main ${SHA:0:9} (unmodified, untested)" --notes-file "$RUNNER_TEMP/notes.md"
          [ "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$commit" ] ||
            { echo "::error::$TAG does not name $commit"; exit 1; }
          echo "published https://github.com/$REPO/releases/tag/$TAG"
