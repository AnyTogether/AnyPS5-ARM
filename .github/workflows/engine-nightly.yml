# A nightly of the Windows and Linux engine for AnyPS5 Desktop and of the macOS app and engine,
# built from main once a day when core/, tools/macos/ or mobile/ changed, and published as a GitHub
# pre-release for the launchers' Nightly update channel.
#
# The tag is named as tools/macos/publish_nightly.sh names the Mac's nightlies:
# v<next>-arm-nightly.<YYYYMMDD>.<n>, <next> being the last release with its last number raised
# and <n> counting that day's nightlies from 1 (UTC), Mac and CI alike. The launchers sort these
# after the release before them and before the release they lead to.
#
# The Windows and Linux build is engine-toolkits.yml's, called with the commit and the tag. The
# macos job builds AnyPS5.app and the engine toolkit on a GitHub Mac (Release, x86-64 under Rosetta,
# BUILD_TESTING=ON, as macos-engine.yml). The pre-release carries AnyPS5-toolkit-windows-<commit>.zip,
# AnyPS5-toolkit-linux-<commit>.zip and .tar.gz, AnyPS5-macOS.zip and
# AnyPS5-toolkit-macos-<version>.zip. It is published only when every build has ended, so it never
# stands half built. When the macOS job fails it goes out without the Mac files; re-running the
# failed job adds them. The phone app is not built here (see the macos job).
#
# CI has no signing key (docs/dev/SIGNED_UPDATES.md), so the pre-release comes out unsigned, and
# the launchers refuse it until tools/release/sign_nightly.sh <tag> has added SHA256SUMS and
# SHA256SUMS.sig on the release Mac (tools/release/nightly_mac.sh does it daily). With dry_run
# everything runs but the step that makes the tag and the release.
#
# The tag and the release are made with GITHUB_TOKEN. Events made with GITHUB_TOKEN start no other
# workflow, so this tag does not start release.yml (`v*`, disabled in this repository anyway) or
# anything else. engine-toolkits.yml's own tag trigger (`v*-arm`) does not match a nightly tag.
#
# Release: by hand with `release` (a pushed vX.Y.Z-arm tag), only the macos job runs, at that tag,
# so AnyPS5.app and AnyPS5-toolkit-macos-X.Y.Z-arm.zip carry the release's version; they stay an
# artifact (engine-toolkit-macos) for the release Mac to sign and publish with the rest of the
# release. The tag's own push builds the Windows and Linux engine (engine-toolkits.yml). No nightly
# tag and no pre-release are made.
#
# Upstream nightly: on its own schedule (or by hand with `upstream`), upstream AnyPS5's main
# (boykopovar/AnyPS5) is built as it is, for AnyPS5 Desktop users who want upstream's newest engine
# rather than AnyPS5-ARM's. It is skipped when upstream's main has not moved since the last
# upstream nightly. engine-toolkits.yml builds it with `repository`: the same toolchains, the smoke
# tests upstream has of AnyPS5-ARM's set, and upstream's own release packaging, named after
# upstream's git describe; the pre-release carries what AnyPS5 Desktop downloads of it:
# relinker-<describe>.exe and prx-windows-<describe>.zip, relinker-<describe> and
# prx-linux-<describe>.tar.gz (the unpatched libraries and the other archive format would only
# make the nightly four times as large). It is published as a pre-release tagged upstream-nightly.<YYYYMMDD>.<9-digit
# upstream commit>: no version the launchers read (they leave it out of updates, and the Mac's
# engine picker looks only for AnyPS5-toolkit-macos-*), and its tag names a commit of its own with
# no parents, so that git describe on main (the relinker's version, the launchers') never finds it.
# It is unsigned too until tools/release/sign_nightly.sh <tag> signs it (nightly_mac.sh does it
# daily); AnyPS5 Desktop offers it on its Nightly channel once it is.
name: Engine nightly

on:
  schedule:
    - cron: '23 2 * * *'
    # The upstream nightly (the upstream-* jobs below).
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even without core/, tools/macos/ or mobile/ changes, or when today already has a CI nightly (with upstream, even when upstream's main has not moved).
        type: boolean
        default: false
      dry_run:
        description: Plan and build, but make no tag and no release.
        type: boolean
        default: false
      upstream:
        description: Build upstream's main (boykopovar/AnyPS5, unmodified) instead of AnyPS5-ARM's.
        type: boolean
        default: false
      release:
        description: A release tag (vX.Y.Z-arm) to build only the Mac app and engine of, as an artifact; no nightly is published.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-nightly${{ (github.event.schedule == '47 0 * * *' || inputs.upstream) && '-upstream' || '' }}${{ inputs.release && format('-{0}', inputs.release) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    if: github.event.schedule != '47 0 * * *' && !inputs.upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          sha="$(git rev-parse HEAD)"
          skip() { echo "::notice::No nightly: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # A release: the Mac app and engine of that tag only.
          if [ -n "$RELEASE" ]; then
            [[ "$RELEASE" =~ ^v[0-9]+(\.[0-9]+)*-arm$ ]] || { echo "::error::$RELEASE is not a vX.Y.Z-arm tag"; exit 1; }
            sha="$(git rev-list -n 1 "refs/tags/$RELEASE" 2>/dev/null)" || { echo "::error::No tag $RELEASE"; exit 1; }
            echo "release $RELEASE at $sha: the macOS job only"
            printf 'build=true\ntag=%s\nsha=%s\nrelease=true\n' "$RELEASE" "$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The last release: the highest vX.Y.Z-arm tag (nightly tags have more after -arm).
          last="$(git tag -l 'v*-arm' | grep -E '^v[0-9]+(\.[0-9]+)*-arm$' | sed 's/^v//; s/-arm$//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          [ -n "$last" ] || { echo "::error::No release tag found"; exit 1; }
          next="$(echo "$last" | awk -F. '{ $NF = $NF + 1; print }' OFS=.)"
          day="$(date -u +%Y%m%d)"
          count=1
          for candidate in $(git tag -l "v$next-arm-nightly.$day.*"); do
            n="${candidate##*.}"
            case "$n" in *[!0-9]*|'') continue ;; esac
            [ "$n" -ge "$count" ] && count=$((n + 1))
          done
          tag="v$next-arm-nightly.$day.$count"

          # The newest nightly that carries the Windows and Linux engine (Mac nightlies may not).
          toolkit_nightly="$(gh api "repos/$REPO/releases?per_page=50" --jq '
            [.[] | select(.draft | not) | select(.prerelease) | select(.tag_name | test("-arm-nightly\\."))
                 | select([.assets[].name | test("^AnyPS5-toolkit-windows-.*\\.zip$")] | any)
                 | select([.assets[].name | test("^AnyPS5-toolkit-linux-.*\\.(zip|tar\\.gz)$")] | any)]
            | sort_by(.created_at) | last | .tag_name // empty')"
          echo "last release v$last-arm, last nightly with toolkits: ${toolkit_nightly:-none}, next tag $tag"

          if [ -n "$toolkit_nightly" ] && [ "$(git rev-list -n 1 "$toolkit_nightly")" = "$sha" ]; then
            skip "$toolkit_nightly already is main's nightly"
          fi
          # Changes are counted from that nightly when it is past the last release, else from the release.
          base="v$last-arm"
          if [ -n "$toolkit_nightly" ] && git merge-base --is-ancestor "$base" "$toolkit_nightly" &&
            git merge-base --is-ancestor "$toolkit_nightly" HEAD; then
            base="$toolkit_nightly"
          fi
          if [ "$FORCE" != true ]; then
            case "$toolkit_nightly" in
              *-arm-nightly."$day".*) skip "today already has $toolkit_nightly" ;;
            esac
            if git diff --quiet "$base" HEAD -- core/ tools/macos/ mobile/; then
              skip "core/, tools/macos/ and mobile/ have not changed since $base"
            fi
          fi
          {
            echo "build=true"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.release != 'true'
    uses: ./.github/workflows/engine-toolkits.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      tag: ${{ needs.plan.outputs.tag }}

  macos:
    name: macOS app and engine
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The launcher's Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 240
    env:
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      VULKAN_SDK_VERSION: 1.4.363.0
    # No phone app: flutter builds it on the runner (AnyTogether CI does), but the APK is signed with
    # the machine's debug key, which a runner makes anew each time, so Android would refuse it over
    # the APK the release Mac signed. It needs that key as a secret first.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # In this checkout only, as engine-toolkits.yml does: the release tag is made when publishing.
      - name: Name the build after the nightly tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"
          actual="$(git describe --tags --dirty)"
          echo "git describe: $actual"
          [ "$actual" = "$TAG" ] || { echo "::error::git describe gives $actual, not $TAG (another tag on this commit?)"; exit 1; }
      - name: Install Rosetta and Ninja
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          brew install ninja
      - id: vulkan
        uses: actions/cache@v6
        with:
          path: ~/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-macos-${{ env.VULKAN_SDK_VERSION }}
      - name: Install the Vulkan SDK
        if: steps.vulkan.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/vulkan.zip" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/mac/vulkansdk-macos-$VULKAN_SDK_VERSION.zip"
          unzip -q "$RUNNER_TEMP/vulkan.zip" -d "$RUNNER_TEMP/vulkan"
          ls "$RUNNER_TEMP/vulkan"
          installer="$(find "$RUNNER_TEMP/vulkan" -type f -perm -u+x -path '*.app/Contents/MacOS/*' | head -n 1)"
          echo "installer: $installer"
          "$installer" --root "$HOME/VulkanSDK/$VULKAN_SDK_VERSION" --accept-licenses --default-answer --confirm-command install
      - name: Check the Vulkan SDK
        run: |
          set -euo pipefail
          sdk="$HOME/VulkanSDK/$VULKAN_SDK_VERSION/macOS"
          ls -l "$sdk/lib/libvulkan.1.dylib" "$sdk/lib/libMoltenVK.dylib" "$sdk/share/vulkan/icd.d/MoltenVK_icd.json" "$sdk/../Licenses/LICENSE.txt"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: engine-nightly-macos
          max-size: 3G
          evict-old-files: job
      - id: ffmpeg
        run: echo "commit=$(git rev-parse HEAD:3rdparty/ffmpeg-core)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build-mac/externals
          key: ffmpeg-macos-${{ steps.ffmpeg.outputs.commit }}
      - name: Configure
        run: >-
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build the engine and the patched libraries
        run: ninja -C build-mac all libs
      # The launcher must build with the newest Xcode's Swift, as in AnyTogether CI.
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Build AnyPS5.app and the engine toolkit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          vulkan="$HOME/VulkanSDK/$VULKAN_SDK_VERSION/macOS"
          out="$GITHUB_WORKSPACE/dist"
          tools/macos/build_launcher_app.sh build-mac "$vulkan" "$out"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$out/AnyPS5.app/Contents/Info.plist")"
          [ "$built" = "$version" ] || { echo "::error::the app says $built, not $version"; exit 1; }
          ditto -c -k --keepParent "$out/AnyPS5.app" "$out/AnyPS5-macOS.zip"
          rm -rf "$out/AnyPS5.app"
          tools/macos/package_toolkit.sh build-mac "$vulkan" "$out"
          [ -s "$out/AnyPS5-toolkit-macos-$version.zip" ] || { echo "::error::package_toolkit.sh made no AnyPS5-toolkit-macos-$version.zip"; exit 1; }
          ls -l "$out"
      # package_toolkit.sh refuses a toolkit built for a newer macOS than the launcher's oldest; the
      # download is checked again as it is published, and the app's own files are listed.
      - name: Check the oldest macOS the downloads run on
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/macos/minimum_macos.py "dist/AnyPS5-toolkit-macos-${TAG#v}.zip" ||
            { echo "::error::the macOS toolkit has files built for a macOS newer than the launcher's oldest"; exit 1; }
          python3 tools/macos/minimum_macos.py --report dist/AnyPS5-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: engine-toolkit-macos
          path: |
            dist/AnyPS5-macOS.zip
            dist/AnyPS5-toolkit-macos-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the pre-release
    needs: [plan, build, macos]
    # Also when the macOS job failed: Windows and Linux do not wait for a Mac. With dry_run it runs
    # up to the last step.
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.plan.outputs.release != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-toolkit-*
          path: dist
          merge-multiple: true
      - name: Write the notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          previous="$(git tag -l 'v*-arm' 'v*-arm-nightly.*' --sort=-creatordate --merged HEAD | sed -n 1p)"
          {
            echo "Nightly build of main, $(date -u +%Y-%m-%d), $(git rev-parse --short=12 HEAD). It may have new bugs: the launchers offer it only on their Nightly update channel."
            echo
            if [ -f dist/AnyPS5-macOS.zip ]; then
              echo "Windows and Linux: the engine for AnyPS5 Desktop. macOS: AnyPS5-macOS.zip and the Mac engine."
            else
              echo "Windows and Linux: the engine for AnyPS5 Desktop. macOS: no files in this nightly, its build failed; the Mac launcher does not offer it."
            fi
            echo
            echo "It is unsigned until it is signed on the release Mac (tools/release/sign_nightly.sh). The launchers refuse it until then."
            echo
            echo "Since ${previous:-the start}:"
            echo
            # git stops at 40 itself: head would close the pipe early and pipefail would fail the job (141).
            git log --no-merges --max-count=40 --format='- %s' ${previous:+"$previous..HEAD"}
            total="$(git rev-list --no-merges --count ${previous:+"$previous..HEAD"})"
            [ "$total" -le 40 ] || echo "- … and $((total - 40)) more"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          ls -l dist
      - name: Check the files
        env:
          MACOS: ${{ needs.macos.result }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ls dist/AnyPS5-toolkit-windows-*.zip dist/AnyPS5-toolkit-linux-*.zip dist/AnyPS5-toolkit-linux-*.tar.gz
          if [ "$MACOS" = success ]; then
            ls -l dist/AnyPS5-macOS.zip "dist/AnyPS5-toolkit-macos-$version.zip"
          else
            echo "::warning::The macOS job ended with $MACOS: this nightly goes out without the Mac files. Re-run the failed job to add them."
          fi
      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            # A re-run of the failed macOS job: its pre-release is out already, at this commit, and only
            # gets the files it lacks. Any other tag of this name stops here.
            [ "$(gh api "repos/$REPO/commits/$TAG" --jq .sha)" = "$SHA" ] &&
              [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = true ] ||
              { echo "::error::$TAG exists already, at another commit or not as a pre-release"; exit 1; }
            have="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
            missing=()
            for file in dist/*; do
              printf '%s\n' "$have" | grep -qx "$(basename "$file")" || missing+=("$file")
            done
            if [ "${#missing[@]}" -eq 0 ]; then echo "$TAG has every file"; exit 0; fi
            gh release upload "$TAG" "${missing[@]}" --repo "$REPO"
            echo "added to https://github.com/$REPO/releases/tag/$TAG: ${missing[*]}"
            exit 0
          fi
          # The tag is made on GitHub at the built commit.
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "AnyPS5-ARM $version (nightly)" --notes-file "$RUNNER_TEMP/notes.md"
          echo "published https://github.com/$REPO/releases/tag/$TAG"

  # ------------------------------------------------------------------ upstream nightly

  upstream-plan:
    name: Decide whether to build upstream main
    if: github.event.schedule == '47 0 * * *' || inputs.upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM: boykopovar/AnyPS5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::No upstream nightly: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          sha="$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No commit for $UPSTREAM main: $sha"; exit 1; }
          short="${sha:0:9}"
          tag="upstream-nightly.$(date -u +%Y%m%d).$short"
          last="$(gh api "repos/$REPO/releases?per_page=100" --jq '
            [.[] | select(.draft | not) | select(.tag_name | test("^upstream-nightly\\.[0-9]{8}\\.[0-9a-f]{9}$"))]
            | sort_by(.created_at) | last | .tag_name // empty')"
          echo "$UPSTREAM main is $sha; last upstream nightly: ${last:-none}; next tag $tag"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            skip "$tag exists already"
          fi
          if [ "$FORCE" != true ] && [ -n "$last" ] && [ "${last##*.}" = "$short" ]; then
            skip "$UPSTREAM main has not moved since $last"
          fi
          {
            echo "build=true"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  upstream-build:
    name: Build upstream main
    needs: upstream-plan
    if: needs.upstream-plan.outputs.build == 'true'
    uses: ./.github/workflows/engine-toolkits.yml
    with:
      repository: boykopovar/AnyPS5
      ref: ${{ needs.upstream-plan.outputs.sha }}
      tag: ${{ needs.upstream-plan.outputs.tag }}

  upstream-publish:
    name: Publish the upstream pre-release
    needs: [upstream-plan, upstream-build]
    if: needs.upstream-plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UPSTREAM: boykopovar/AnyPS5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-upstream-*
          path: dist
          merge-multiple: true
      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.upstream-plan.outputs.sha }}
        run: |
          set -euo pipefail
          ls -l dist
          relinker="$(cd dist && ls relinker-v*.exe)"
          describe="${relinker#relinker-}"; describe="${describe%.exe}"
          date="$(gh api "repos/$UPSTREAM/commits/$SHA" --jq .commit.committer.date)"
          subject="$(gh api "repos/$UPSTREAM/commits/$SHA" --jq '.commit.message | split("\n") | first')"
          {
            echo "**Unmodified upstream main, untested.**"
            echo
            echo "Upstream commit: [\`$SHA\`](https://github.com/$UPSTREAM/commit/$SHA) ($date, git describe \`$describe\`): $subject"
            echo
            echo "Built by AnyPS5-ARM's CI from $UPSTREAM main as it is, with nothing of AnyPS5-ARM's in it (so no phone controller and no full screen or window size settings): the relinker and the libraries upstream's own release packaging makes, for Windows (WinLibs GCC 15.2, the libraries as .zip) and Linux (Ubuntu 22.04, GCC 12: glibc 2.35 or newer; the libraries as .tar.gz). The unpatched libraries are left out. Only the build and the smoke tests upstream has of AnyPS5-ARM's set ran; no game was tried."
            echo
            echo "It is neither an upstream release nor an AnyPS5-ARM one. AnyPS5 Desktop offers it only on its Nightly update channel, and only once it is signed on the release Mac (tools/release/sign_nightly.sh): until then the launchers refuse it. The Mac launcher does not offer it."
            echo
            echo "<!-- upstream-commit: $SHA -->"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          echo "DESCRIBE=$describe" >> "$GITHUB_ENV"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.upstream-plan.outputs.tag }}
          SHA: ${{ needs.upstream-plan.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag names a commit of its own, with no parents: it is in none of main's history, so
          # git describe on main never takes it for the version.
          readme="$(printf '%s\n\n%s\n' "# $TAG" "Upstream AnyPS5's main at https://github.com/$UPSTREAM/commit/$SHA ($DESCRIBE), built unmodified by AnyPS5-ARM's CI. The files are on the release: https://github.com/$REPO/releases/tag/$TAG")"
          tree="$(jq -n --arg text "$readme" '{tree: [{path: "UPSTREAM.md", mode: "100644", type: "blob", content: $text}]}' |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "Upstream nightly: $UPSTREAM $SHA" --arg tree "$tree" '{message: $message, tree: $tree, parents: []}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)"
          gh release create "$TAG" dist/* --repo "$REPO" --target "$commit" --prerelease --latest=false \
            --title "Upstream main ${SHA:0:9} (unmodified, untested)" --notes-file "$RUNNER_TEMP/notes.md"
          [ "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$commit" ] ||
            { echo "::error::$TAG does not name $commit"; exit 1; }
          echo "published https://github.com/$REPO/releases/tag/$TAG"
